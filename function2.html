// TASK 6: Electricity Bill
// 0-100   = ₹5/unit
// 101-200 = ₹7/unit
// 201+    = ₹10/unit
// =====================================================

function electricityBill(units) {
    let bill;

    if (units <= 100) {
        bill = units * 5;
    } else if (units <= 200) {
        bill = (100 * 5) + ((units - 100) * 7);
    } else {
        bill = (100 * 5) + (100 * 7) + ((units - 200) * 10);
    }

    return bill;
}

    if (
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /[0-9]/.test(password) &&
        /[!@#$%^&*]/.test(password)
    ) {
        return "Strong Password";
    } else {
        return "Weak Password";
    }
}

// =====================================================
// TASK 8: Three-Digit Armstrong Number
// =====================================================

function isArmstrong(num) {
    let original = num;
    let sum = 0;

    while (num > 0) {
        let digit = num % 10;
        sum = sum + digit ** 3;
        num = Math.floor(num / 10);
    }

    if (sum === original) {
        return "Armstrong Number";
    } else {
        return "Not Armstrong Number";
    }
}

console.log("Task 8:", isArmstrong(153));


// =====================================================
// TASK 9: Prime Number
// =====================================================

function isPrime(num) {
    if (num < 2) {
        return false;
    }

    for (let i = 2; i < num; i++) {
        if (num % i === 0) {
            return false;
        }
    }

    return true;
}

console.log("Task 9:", isPrime(7));

    if ((a > b && a < c) || (a > c && a < b)) {
        return a;

// =====================================================
// TASK 14: Nested Ternary - Largest of Three
// =====================================================

function largestTernary(a, b, c) {
    return a > b
        ? (a > c ? a : c)
        : (b > c ? b : c);
}

function celsiusToFahrenheit(celsius) {
    return (celsius * 9 / 5) + 32;
}

function fahrenheitToCelsius(fahrenheit) {
    return (fahrenheit - 32) * 5 / 9;
}

    } else {
        result = "Fail";
    }

    return {

        percentage: percentage,
        grade: grade,
        result: result,

    };
}
