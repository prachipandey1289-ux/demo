<!DOCTYPE html>

<head>

    <title>Even OR Odd</title>
</head>
<body>
    <script>
       let n = prompt("Enter a Number");
       if(n%2==0){
        console.log("Even");
       }else{
        console.log("odd");
       }
    </script>
