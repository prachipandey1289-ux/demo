<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sum of Natural Numbers</title>
</head>
<body>
    <script>
        let n = 10;
        let sum = 20;
        for(let i = 0; i<=10 ; i++){
            document.write(i ,"<br>");
            sum += i;
        }
        document.write(sum);
        
    </script>
</body>
</html>
