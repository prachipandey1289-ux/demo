<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>palindrome</title>
</head>
<body><script>
let word = 121;

word = word.toString();
let reverse = String(word).split("").reverse().join("");

if (String(word) === reverse) {
   document.write("Palindrome");
} else {
    document.write("Not a palindrome");
}


</script>
</body>
</html>
