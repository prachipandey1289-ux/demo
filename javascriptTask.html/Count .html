<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number count</title>
</head>
<body>
    <script>
        for(let i = 1 ; i <=50; i++){
         document.write("<br>",i); 
        }
         for(let i = 1 ; i <=50; i++){
            if(i %5 ==0){
         document.write("<br>",i); 
            }
        }
    </script>
</body>
</html>
