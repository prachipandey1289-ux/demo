<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        #container {
            background-color: aqua;
            width: 500px;
            height: 300px;
            justify-content: center;
            text-align: center;
        }

        button {
            border: 2px solid black;
            border-radius: 2px;
            height: 25px;
            width: 35px;
        }
    </style>
</head>

<body>

    <h1>Calculator</h1>

    <div id="container">

        <p>
            <input type="text" id="calci" placeholder="0">
        </p>

        <br><br>

        <button>Deg</button>
        <button>Rad</button>
        <button>x!</button>
        <button>(</button>
        <button>)</button>
        <button value="%">%</button>
        <button>AC</button>

        <br><br>

        <button>lnv</button>
        <button>sin</button>
        <button>ln</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button value="/">/</button>

        <br><br>

        <button>pi</button>
        <button>con</button>
        <button>log</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button value="*">*</button>

        <br><br>

        <button>e</button>
        <button>tan</button>
        <button>UR</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button value="-">-</button>

        <br><br>

        <button>Ans</button>
        <button>EXP</button>
        <button>X</button>
        <button>0</button>
        <button value=".">.</button>
        <button value="=">=</button>
        <button value="+">+</button>

    </div>


    <script>
        let expression = "";
        let buttons = document.querySelectorAll("button");
        let display = document.getElementById("calci");
        buttons.forEach(function(button) {
            button.addEventListener("click", function() {
                let value = button.value;
                if (value == "+" ||
                    value == "-" ||
                    value == "*" ||
                    value == "/" ||
                    value == "%" ||
                    value == ".") {
                    expression = expression + value;
                    display.value = expression;
                }
            });
        });

    </script>

</body>
</html>
