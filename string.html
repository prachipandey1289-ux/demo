       function calculateAverage(marks) {

    let average = (marks[0] + marks[1] + marks[2]) / 3;

    return average;
}


// Arrow Function
const greetStudent = (name) => {

    return "Hello " + name + "! Welcome to Student Utility App.";

};


function calculateResult() {

    let name = document.getElementById("studentName").value;

    let mark1 = Number(document.getElementById("mark1").value);
    let mark2 = Number(document.getElementById("mark2").value);
    let mark3 = Number(document.getElementById("mark3").value);


    // Total
    let total = mark1 + mark2 + mark3;


    // Percentage
    let percentage = (total / 300) * 100;


    // Average using return value
    let average = calculateAverage([mark1, mark2, mark3]);


    // Grade
    let grade;

    if (percentage >= 90) {
        grade = "A+";
    }
    else if (percentage >= 80) {
        grade = "A";
    }
    else if (percentage >= 70) {
        grade = "B";
    }
    else if (percentage >= 60) {
        grade = "C";
    }
    else if (percentage >= 50) {
        grade = "D";
    }
    else {
        grade = "F";
    }


    // Pass / Fail
    let status;

    if (mark1 >= 33 && mark2 >= 33 && mark3 >= 33) {
        status = "Pass";
    }
    else {
        status = "Fail";
    }


    // Display output
    document.getElementById("greeting").innerHTML =
        greetStudent(name);

    document.getElementById("total").innerHTML =
        "Total Marks: " + total + " / 300";

    document.getElementById("percentage").innerHTML =
        "Percentage: " + percentage.toFixed(2) + "%";

    document.getElementById("average").innerHTML =
        "Average: " + average.toFixed(2);

    document.getElementById("grade").innerHTML =
        "Grade: " + grade;

    document.getElementById("status").innerHTML =
        "Result: " + status;
}
