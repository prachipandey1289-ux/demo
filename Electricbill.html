<!-- Electricity Bill Calculator: Create a program to calculate an 
 electricity bill based on units consumed and different pricing slabs. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric</title>
</head>
<body>
    <h1>Electric Bill</h1>
    <label>Enter Units</label>
    <input type="text" id="electricity">
    <button onclick="calculatebill()">Calculate</button>
    <h2 id="price"></h2>
    <script>
    function calculatebill(){
        let unit =Number(document.getElementById("electricity").value);
        let bill;
        if(unit <= 100){
bill = unit *5;
        }else if(unit <= 200){
           bill= (100 * 5) + ((unit - 100) *7);
        }
   else if(unit <=300){
        bill = (100*5) + (100 *7) + ((unit -200)*10);
    } 
else {
    bill = (100 * 5) + (100 * 7) + (100 * 10) + ((unit - 300) * 12);
}
     document.getElementById("price").innerHTML = bill.toFixed(2);
            
            }
    </script>
</body>
</html>
