<!DOCTYPE html>

    <title>Largest Number</title>
</head>
<body>
    <label>Number 1</label>
    <input type="text" name=" number" id="num1"><br><br>
   <label>Number 2</label>
   <input type="text" name=" number" id="num2"><br><br>
   <label>Number 3</label>
   <input type="text" name="number" id="num3"><br><br>
<button onclick="largestnumber()">Find</button>
<h2 id="number"></h2>
<script>
    function largestnumber(){
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    let c =Number(document.getElementById("num3").value);
       let value;
    if(a>b && a>c){
   value= "A";
    }else if(b>a && b>c){
        value ="B";
    }else if(c>b && c>a){
      value="C";
    }else{
        value="All Value Same";
    }

    
    document.getElementById("number").innerHTML=value;
}
</script>
</body>
