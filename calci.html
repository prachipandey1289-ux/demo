<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <style>
        #container{
            
    background-color: aqua;
    width: 500px;height: 300px;
   justify-content: center;
   text-align: center;
        }
     button{
        border: 1px solid black;
        border-radius: 2px ;
        height:25px;
        width: 35px;
     }
    </style>
</head>
<body>
    <h1>Calculator</h1>
    <div id="container">
        <p>       <input type="text" id="calci" placeholder="0"></p> <br><br>
    <button>Deg</button>
    <button>Rad</button>
    <button>x!</button>
    <button>(</button>
    <button>)</button>
    <button value="%">%</button>
    <button>AC</button>
    <br><br>
    <button>lnv</button>
    <button>sin</button>
    <button>ln</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button value="/">/</button>
    <br><br>
    <button>pi</button>
    <button>con</button>
    <button>log</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button value="*">*</button>
<br><br>
    <button>e</button>
    <button>tan</button>
    <button>UR</button>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button value="-">-</button>
<br><br>
    <button>Ans</button>
    <button>EXP</button>
    <button>X</button>
    <button>0</button>
    <button value=".">.</button>
    <button value="=">=</button>
    <button value="+">+</button>

    </div>
    <script>
      let n = number(document.getElementById("calci").value);
     let buttons = document.querySelectorAll("button");
     for(let i = 0; i < buttons.length; i++){
     
 buttons[i].onclick = function () {
                let value = buttons[i].value;
                if (value == "+" ||  value == "-" ||  value == "*" || value == "/" ||  value == "%") {
                    calci.value = calci.value + value;
                }
                else if (value == "=") {
                    calci.value = calci.value;
                }
                else if (buttons[i].innerHTML == "AC") {
                    calci.value = "";
                }
                else if (buttons[i].innerHTML == "X") {
                    calci.value = calci.value.slice(0, -1);
                }
                else if (buttons[i].innerHTML >= "0" &&
                         buttons[i].innerHTML <= "9") {
                    calci.value = calci.value + buttons[i].innerHTML;
                }
            }
        }
    </script>
</body>
</html>
